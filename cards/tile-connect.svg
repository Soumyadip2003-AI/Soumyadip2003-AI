<svg xmlns="http://www.w3.org/2000/svg" width="286" height="210" viewBox="0 0 286 210" role="img" aria-labelledby="title"><title id="title">Connect: 1 message away. LinkedIn is quickest. Or email soumyadip.0202@gmail.com.</title><style>@font-face{font-family:'Geist';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Geist Mono';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Instrument Serif';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Instrument Serif Italic';src:url(data:font/woff;base64,) format('woff')}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
