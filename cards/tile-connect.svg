.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.still{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.still{display:inline}}
