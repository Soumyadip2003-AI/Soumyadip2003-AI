" begin="4.05s" fill="freeze"/></text></g><g class="still"><text x="22.0" y="112.0" font-family="'Instrument Serif', Georgia, serif" font-size="54" fill="#ffffff" letter-spacing="-1">6</text></g><text x="52.0" y="112.0" font-family="'Instrument Serif Italic', Georgia, serif" font-size="44.279999999999994" fill="#ffffff" letter-spacing="-0.5">live apps</text><text x="24.0" y="150.0" font-family="'Geist', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#ffffff">Every one deployed and running.</text><text x="24.0" y="171.0" font-family="'Geist', system-ui, -apple-system, sans-serif" font-size="14.5" fill="#ffffff">Try them from my portfolio.</text><g class="smil"><circle cx="256" cy="180" r="0" fill="none" stroke="#ffffff" stroke-opacity="0"><animate attributeName="r" values="0;60" dur="2.8s" begin="4.55s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".55;0" dur="2.8s" begin="4.55s" repeatCount="indefinite"/></circle><rect x="-140" y="-40" width="70" height="290" fill="#ffffff" opacity=".18" transform="skewX(-18)"><animate attributeName="x" values="-140;406;406" keyTimes="0;.25;1" dur="6s" begin="5.35s" repeatCount="indefinite"/></rect></g></g></g></svg>